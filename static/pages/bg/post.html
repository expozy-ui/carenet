<!-- Main Content -->
<main class="flex-1 bg-gray-50" apidata="get.blogPosts" keyname="post" :data-id="data.corePage.target_id">

    <!-- Hero Section -->
    <div class="bg-gradient-to-br from-primary-500 to-primary-700 text-white">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8 lg:px-8 py-12 lg:py-16">
            <!-- Breadcrumb -->
            <div class="flex items-center gap-2 text-primary-100 mb-4">
                <a href="/bg/blog" class="hover:text-white transition-colors">Блог</a>
                <i class="fa-solid fa-chevron-right text-xs"></i>
                <span @click="href(data.post.category.url)" class="hover:text-white transition-colors cursor-pointer" x-text="data.post.category.title"></span>
            </div>
            <!-- Title -->
            <h1 class="text-2xl lg:text-4xl font-bold mb-4 max-w-4xl" x-text="data.post.title"></h1>
            <!-- Meta -->
            <div class="flex flex-wrap items-center gap-4 text-primary-100">
                <span class="flex items-center gap-2">
                    <i class="fa-regular fa-calendar"></i>
                    <span x-text="new Date(data.post.date_created).toLocaleDateString('bg-BG')"></span>
                </span>
                <span class="flex items-center gap-2">
                    <i class="fa-regular fa-clock"></i>
                    <span x-text="(data.post.read_time != 0 ? data.post.read_time : '1') + ' мин. четене'"></span>
                </span>
                <span class="flex items-center gap-2">
                    <i class="fa-regular fa-eye"></i>
                    <span x-text="data.post.views + ' прегледа'"></span>
                </span>
            </div>
        </div>
    </div>

    <div class="container mx-auto px-4 sm:px-6 lg:px-8 lg:px-8 py-8">
        <div class="flex flex-col lg:flex-row gap-8">

            <!-- Main Content -->
            <div class="flex-1 min-w-0">
                <!-- Featured Image -->
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden mb-8">
                    <img :src="data.post.images[0] ? data.post.images[0].url : Helpers.image('product')" :alt="data.post.title" class="w-full h-64 lg:h-96 object-cover">
                </div>

                <!-- Article Content -->
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 lg:p-8 mb-8">
                    <!-- Share Buttons -->
                    <div class="flex items-center justify-between pb-6 mb-6 border-b border-gray-100">
                        <span class="text-sm text-gray-500">Сподели:</span>
                        <div class="flex items-center gap-2">
                            <a href="#" class="w-9 h-9 bg-blue-600 hover:bg-blue-700 text-white rounded-lg flex items-center justify-center transition-colors">
                                <i class="fa-brands fa-facebook-f text-sm"></i>
                            </a>
                            <a href="#" class="w-9 h-9 bg-sky-500 hover:bg-sky-600 text-white rounded-lg flex items-center justify-center transition-colors">
                                <i class="fa-brands fa-twitter text-sm"></i>
                            </a>
                            <a href="#" class="w-9 h-9 bg-blue-700 hover:bg-blue-800 text-white rounded-lg flex items-center justify-center transition-colors">
                                <i class="fa-brands fa-linkedin-in text-sm"></i>
                            </a>
                            <button class="w-9 h-9 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-lg flex items-center justify-center transition-colors">
                                <i class="fa-solid fa-link text-sm"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Article Body -->
                    <div class="prose prose-lg max-w-none prose-headings:text-gray-900 prose-p:text-gray-600 prose-a:text-primary-600 hover:prose-a:text-primary-700 prose-img:rounded-xl" x-html="data.post.description"></div>

                    <!-- Tags -->
                    <template x-if="data.post.tags && data.post.tags[0]">
                        <div class="mt-8 pt-6 border-t border-gray-100">
                            <h3 class="text-sm font-semibold text-gray-700 mb-3">Тагове</h3>
                            <div class="flex flex-wrap gap-2">
                                <template x-for="tag in data.post.tags">
                                    <button @click="href('/bg/blog?tags[]='+tag)" class="px-4 py-2 bg-gray-100 text-gray-600 rounded-full text-sm font-medium hover:bg-primary-500 hover:text-white transition-colors" x-text="tag"></button>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Related Posts (Same Category) -->
                <template x-if="data.post">
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 lg:p-8 mb-8" x-init="alpineListeners('get.blogPosts', $el)" keyName="sameCategoryPosts">
                        <h3 class="text-xl font-bold text-gray-900 mb-6 flex items-center gap-2">
                            <i class="fa-solid fa-folder text-primary-500"></i>
                            Още от тази категория
                        </h3>
                        <div class="space-y-3">
                            <template x-for="sameCategoryPosts in data.sameCategoryPosts.result">
                                <template x-if="sameCategoryPosts.id != data.corePage.target_id">
                                    <a @click.prevent="href(sameCategoryPosts.url)" class="flex items-center gap-3 p-3 rounded-xl hover:bg-gray-50 transition-colors cursor-pointer group">
                                        <i class="fa-solid fa-chevron-right text-primary-500 text-xs"></i>
                                        <span class="text-gray-700 group-hover:text-primary-600 transition-colors" x-text="sameCategoryPosts.title"></span>
                                    </a>
                                </template>
                            </template>
                        </div>
                    </div>
                </template>

                <!-- Comments Section -->
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 lg:p-8" apidata="Reviews.get_blog_comments" :data-subject_id="data.corePage.target_id" keyname="blogReviews">
                    <h3 class="text-xl font-bold text-gray-900 mb-6 flex items-center gap-2">
                        <i class="fa-solid fa-comments text-primary-500"></i>
                        Коментари
                    </h3>

                    <!-- Comments List -->
                    <div class="space-y-6 mb-8">
                        <template x-for="review in data.blogReviews">
                            <div class="flex gap-4 p-4 bg-gray-50 rounded-xl">
                                <div class="w-12 h-12 bg-primary-100 rounded-full flex items-center justify-center flex-shrink-0">
                                    <i class="fa-solid fa-user text-primary-600"></i>
                                </div>
                                <div class="flex-1">
                                    <div class="flex items-center gap-3 mb-2">
                                        <span class="font-semibold text-gray-900" x-text="review.user_name"></span>
                                        <span class="text-sm text-gray-500" x-text="review.date"></span>
                                    </div>
                                    <div class="flex mb-2">
                                        <template x-for="item in review.rating">
                                            <i class="fa-solid fa-star text-amber-400 text-sm"></i>
                                        </template>
                                    </div>
                                    <p class="text-gray-600" x-text="review.comment"></p>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- Comment Form -->
                    <div class="border-t border-gray-100 pt-6" x-data="{ reviewOpen: false }">
                        <button @click="reviewOpen = !reviewOpen" class="flex items-center justify-between w-full text-left">
                            <h4 class="text-lg font-semibold text-gray-900">Оставете коментар</h4>
                            <i :class="reviewOpen ? 'rotate-45' : ''" class="fa-solid fa-plus text-primary-500 text-xl transition-transform"></i>
                        </button>

                        <form x-show="reviewOpen" x-collapse class="mt-6 space-y-4">
                            <input type="hidden" name="subject_id" :value="data.corePage.target_id">

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-semibold text-gray-700 mb-2">Имейл</label>
                                    <input type="email" name="email" :value="data.user.email" placeholder="example@email.com" class="w-full px-4 py-3 bg-white rounded-xl border border-gray-200 focus:border-primary-500 focus:ring-2 focus:ring-primary-200 transition-colors">
                                </div>
                                <div>
                                    <label class="block text-sm font-semibold text-gray-700 mb-2">Име</label>
                                    <input type="text" name="user_name" :value="data.user.names" placeholder="Вашето име" class="w-full px-4 py-3 bg-white rounded-xl border border-gray-200 focus:border-primary-500 focus:ring-2 focus:ring-primary-200 transition-colors">
                                </div>
                            </div>

                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">Коментар</label>
                                <textarea rows="4" name="comment" placeholder="Напишете вашия коментар..." class="w-full px-4 py-3 bg-white rounded-xl border border-gray-200 focus:border-primary-500 focus:ring-2 focus:ring-primary-200 transition-colors resize-none"></textarea>
                            </div>

                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-3">Оценка</label>
                                <div x-data="{ temp: 0, orig: 0 }" class="flex gap-1 cursor-pointer" @click="orig = temp">
                                    <input type="number" name="rating" :value="orig" class="hidden">
                                    <template x-for="item in [1,2,3,4,5]">
                                        <i @mouseenter="temp = item" @mouseleave="temp = orig" :class="temp >= item ? 'fa-solid text-amber-400' : 'fa-regular text-gray-300'" class="fa-star text-2xl transition-colors"></i>
                                    </template>
                                </div>
                            </div>

                            <button @click="alpineListeners('Reviews.post_blog_comments', $event)" options-clear="true" class="bg-accent-500 hover:bg-accent-600 text-white font-semibold px-6 py-3 rounded-xl transition-colors shadow-lg shadow-accent-500/30">
                                <i class="fa-solid fa-paper-plane mr-2"></i>
                                Публикувай коментар
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Sidebar -->
            <aside class="lg:w-80 flex-shrink-0">
                <div class="sticky top-24 space-y-6">

                    <!-- Related Posts -->
                    <template x-if="data.post.related_posts && data.post.related_posts[0]">
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                            <h3 class="text-lg font-bold text-gray-900 mb-4 flex items-center gap-2">
                                <i class="fa-solid fa-link text-primary-500"></i>
                                Свързани статии
                            </h3>
                            <div class="space-y-4">
                                <template x-for="related in data.post.related_posts">
                                    <div @click="href(related.url)" class="group cursor-pointer">
                                        <div class="aspect-video rounded-xl overflow-hidden mb-3">
                                            <img :src="related.images[0] ? related.images[0].url : Helpers.image('product')" :alt="related.title" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                                        </div>
                                        <h4 class="font-semibold text-gray-900 group-hover:text-primary-600 transition-colors line-clamp-2 text-sm" x-text="related.title"></h4>
                                        <p class="text-xs text-gray-500 mt-1" x-text="related.date_publish"></p>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>

                    <!-- Newest Posts -->
                    <template x-if="data.post">
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6" x-init="alpineListeners('get.blogPosts', $el)" data-sort="newest" keyName="newestPosts">
                            <h3 class="text-lg font-bold text-gray-900 mb-4 flex items-center gap-2">
                                <i class="fa-solid fa-clock-rotate-left text-primary-500"></i>
                                Последни статии
                            </h3>
                            <div class="space-y-4">
                                <template x-for="newestPosts in data.newestPosts.result">
                                    <template x-if="newestPosts.id != data.corePage.target_id">
                                        <div @click="href(newestPosts.url)" class="group cursor-pointer">
                                            <div class="aspect-video rounded-xl overflow-hidden mb-3">
                                                <img :src="newestPosts.images[0] ? newestPosts.images[0].url : Helpers.image('product')" :alt="newestPosts.title" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                                            </div>
                                            <h4 class="font-semibold text-gray-900 group-hover:text-primary-600 transition-colors line-clamp-2 text-sm" x-text="newestPosts.title"></h4>
                                            <p class="text-xs text-gray-500 mt-1" x-text="newestPosts.date_publish"></p>
                                        </div>
                                    </template>
                                </template>
                            </div>
                        </div>
                    </template>

                    <!-- Back to Blog -->
                    <a href="/bg/blog" class="flex items-center justify-center gap-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold px-6 py-3 rounded-xl transition-colors w-full">
                        <i class="fa-solid fa-arrow-left"></i>
                        Обратно към блога
                    </a>
                </div>
            </aside>
        </div>
    </div>
</main>
