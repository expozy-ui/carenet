<!-- Header -->
<header class="bg-white border-b border-gray-100 sticky top-0 z-50" x-data="{ mobileMenu: false }">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8 lg:px-8">
        <div class="flex justify-between items-center h-18 py-2">

            <!-- Logo -->
            <a @click="href('/')" class="flex items-center gap-2">
                <img src="https://r2.expozy.com/supercare/logov4.svg" alt="CareNet" class="h-14 ">
            </a>

            <!-- Desktop Navigation -->
            <nav class="hidden md:flex items-center gap-8">
                <button @click="href('/blog')" class="text-gray-600 hover:text-primary-600 font-medium transition-colors">Блог</button>
                <button @click="href('/about')" class="text-gray-600 hover:text-primary-600 font-medium transition-colors">За нас</button>
                <button @click="href('/contacts')" class="text-gray-600 hover:text-primary-600 font-medium transition-colors">Контакти</button>

                <template x-if="data.user.logged_in == 0">
                    <button @click="href('/login')" class="flex items-center gap-2 bg-accent-500 hover:bg-accent-600 text-white px-4 py-2 rounded-lg font-medium transition-colors">
                        <i class="fa-solid fa-user"></i>
                        Вход
                    </button>
                </template>

                <template x-if="data.user.logged_in == 1">
                    <button @click="href('/userpage')" class="flex items-center gap-2 bg-accent-500 hover:bg-accent-600 text-white px-4 py-2 rounded-lg font-medium transition-colors">
                        <i class="fa-solid fa-user"></i>
                        Профил
                    </button>
                </template>

            </nav>

            <!-- Mobile Menu Button -->
            <button @click="mobileMenu = !mobileMenu" class="md:hidden p-2 text-gray-600 hover:text-primary-600 transition-colors">
                <i x-show="!mobileMenu" class="fa-solid fa-bars text-xl"></i>
                <i x-show="mobileMenu" x-cloak class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>
    </div>

    <!-- Mobile Navigation -->
    <div x-show="mobileMenu" x-cloak x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 -translate-y-2" x-transition:enter-end="opacity-100 translate-y-0" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100 translate-y-0" x-transition:leave-end="opacity-0 -translate-y-2" class="md:hidden bg-white border-t border-gray-100">
        <nav class="max-w-7xl mx-auto px-4 py-4 flex flex-col gap-2">

            <button @click="href('/blog')" class="text-gray-600 hover:text-primary-600 hover:bg-primary-50 px-4 py-3 rounded-lg font-medium transition-colors">Блог</button>
            <button @click="href('/about')" class="text-gray-600 hover:text-primary-600 hover:bg-primary-50 px-4 py-3 rounded-lg font-medium transition-colors">За нас</button>
            <button @click="href('/contacts')" class="text-gray-600 hover:text-primary-600 hover:bg-primary-50 px-4 py-3 rounded-lg font-medium transition-colors">Контакти</button>

            <template x-if="data.user.logged_in == 0">
                <button @click="href('/login')" class="flex items-center justify-center gap-2 bg-accent-500 hover:bg-accent-600 text-white px-4 py-3 rounded-lg font-medium transition-colors mt-2">
                    <i class="fa-solid fa-user"></i>
                    Вход
                </button>
            </template>

            <template x-if="data.user.logged_in == 1">
                <button @click="href('/userpage')" class="flex items-center justify-center gap-2 bg-accent-500 hover:bg-accent-600 text-white px-4 py-3 rounded-lg font-medium transition-colors mt-2">
                    <i class="fa-solid fa-user"></i>
                    Профил
                </button>
            </template>

        </nav>
    </div>
</header>
