<!-- Main Content -->
<main class="flex-1 bg-gradient-to-br from-primary-50 via-white to-primary-50 min-h-screen">
    <div class="flex flex-col items-center justify-center px-4 py-12 mx-auto min-h-screen">

        <!-- Logo/Brand -->
        <!-- <a href="/bg" class="flex items-center gap-3 mb-8">
            <div class="w-12 h-12 bg-gradient-to-br from-primary-500 to-primary-600 rounded-xl flex items-center justify-center shadow-lg shadow-primary-500/30">
                <i class="fa-solid fa-heart-pulse text-white text-xl"></i>
            </div>
            <span class="text-2xl font-bold"><span class="text-primary-500">Care</span><span class="text-accent-400">Net</span></span>
        </a> -->

        <a @click="href('/')" class="flex items-center gap-2 mb-4">
            <img src="https://r2.expozy.com/supercare/logov4.svg" alt="CareNet" class="h-16 ">
        </a>

        <!-- Forgot Password Card -->
        <div class="w-full max-w-md">
            <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-8">
                <!-- Header -->
                <div class="text-center mb-8">
                    <div class="inline-flex items-center justify-center w-16 h-16 bg-primary-100 rounded-full mb-4">
                        <i class="fa-solid fa-key text-primary-600 text-2xl"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-gray-900 mb-2">Забравена парола</h1>
                    <p class="text-gray-500">Въведете вашия имейл и ще ви изпратим инструкции за възстановяване</p>
                </div>

                <!-- Form -->
                <form class="space-y-5">
                    <!-- Email -->
                    <div>
                        <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">Имейл адрес</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
                                <i class="fa-solid fa-envelope text-gray-400"></i>
                            </div>
                            <input type="email" name="email" id="email" placeholder="name@example.com" required class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:border-primary-500 focus:ring-2 focus:ring-primary-200 transition-colors">
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button @click="alpineListeners('User.post_forgot_password', $event)" class="w-full bg-accent-500 hover:bg-accent-600 text-white font-semibold py-3 px-6 rounded-xl transition-colors shadow-lg shadow-accent-500/30 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-paper-plane"></i>
                        Изпрати инструкции
                    </button>

                    <!-- Info Box -->
                    <div class="bg-primary-50 border border-primary-100 rounded-xl p-4">
                        <div class="flex gap-3">
                            <i class="fa-solid fa-circle-info text-primary-500 mt-0.5"></i>
                            <div class="text-sm text-primary-700">
                                <p class="font-medium mb-1">Какво следва?</p>
                                <p class="text-primary-600">Ще получите имейл с линк за създаване на нова парола. Линкът е валиден 24 часа.</p>
                            </div>
                        </div>
                    </div>

                    <!-- Divider -->
                    <div class="relative my-6">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-gray-200"></div>
                        </div>
                        <div class="relative flex justify-center text-sm">
                            <span class="px-4 bg-white text-gray-500">или</span>
                        </div>
                    </div>

                    <!-- Links -->
                    <div class="flex items-center justify-between">
                        <button type="button" @click="href('/bg/login')" class="flex items-center gap-2 text-gray-600 hover:text-primary-600 font-medium transition-colors">
                            <i class="fa-solid fa-arrow-left text-sm"></i>
                            Обратно към вход
                        </button>
                        <button type="button" @click="href('/bg/registration')" class="flex items-center gap-2 text-primary-600 hover:text-primary-700 font-medium transition-colors">
                            Регистрация
                            <i class="fa-solid fa-arrow-right text-sm"></i>
                        </button>
                    </div>
                </form>
            </div>

            <!-- Help Text -->
            <p class="text-center text-sm text-gray-500 mt-6">
                Все още имате проблеми?
                <button type="button" @click="href('/bg/contact')" class="text-primary-600 hover:text-primary-700 font-medium">
                    Свържете се с нас
                </button>
            </p>
        </div>
    </div>
</main>
