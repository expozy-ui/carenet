<!-- Main Content -->
<main class="flex-1 bg-gray-50" apiData="get.doctors" :data-id="data.pageUrl.id" keyName="doctor">

    <div class="max-w-7xl lg:container mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- Breadcrumb -->
        <nav class="flex items-center gap-2 text-sm text-gray-500 mb-6">
            <a href="/bg/homepage" class="hover:text-primary-600">Начало</a>
            <i class="fa-solid fa-chevron-right text-xs"></i>
            <a href="/bg/search" class="hover:text-primary-600">Търсене</a>
            <i class="fa-solid fa-chevron-right text-xs"></i>
            <span class="text-gray-900" x-text="data.doctor.user_info.names"></span>
        </nav>

        <div class="grid lg:grid-cols-5 gap-8">

            <!-- Left Column - Doctor Profile -->
            <div class="lg:col-span-3 space-y-6">

                <!-- Profile Card -->
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 lg:p-8">
                    <div class="flex flex-col sm:flex-row gap-6">
                        <!-- Photo -->
                        <div class="flex-shrink-0">
                            <template x-if="data.doctor.avatar && data.doctor.avatar.url">
                                <img :src="data.doctor.avatar.url" :alt="data.doctor.user_info.names"
                                    class="w-32 h-32 sm:w-40 sm:h-40 rounded-2xl object-cover shadow-lg">
                            </template>
                            <template x-if="!data.doctor.avatar || !data.doctor.avatar.url">
                                <div
                                    class="w-32 h-32 sm:w-40 sm:h-40 rounded-2xl bg-primary-100 flex items-center justify-center shadow-lg">
                                    <i class="fa-solid fa-user-doctor text-primary-500 text-5xl"></i>
                                </div>
                            </template>
                        </div>

                        <!-- Info -->
                        <div class="flex-1">
                            <h1 class="text-2xl lg:text-3xl font-bold text-gray-900"
                                x-text="data.doctor.user_info.names"></h1>
                            <p class="text-base text-primary-600 font-medium mt-1"
                                x-text="(data.doctor.specialities?.length ? data.doctor.specialities : (data.doctor.speciality ? [data.doctor.speciality] : [])).map(s => s.title).join(', ')">
                            </p>

                            <!-- Rating -->
                            <div class="flex items-center gap-3 mt-3" x-data="{
                                get avgRating() {
                                    const results = data.doctor_ratings?.result;
                                    if (!results || results.length === 0) return 0;
                                    const sum = results.reduce((a, r) => a + r.rating, 0);
                                    return (sum / results.length).toFixed(1);
                                },
                                get totalReviews() {
                                    return data.doctor_ratings?.pagination?.total_results || 0;
                                }
                            }">
                                <div class="flex items-center gap-1">
                                    <template x-for="s in 5" :key="s">
                                        <i
                                            :class="s <= Math.round(parseFloat(avgRating)) ? 'fa-solid fa-star text-amber-400' : 'fa-regular fa-star text-gray-300'"></i>
                                    </template>
                                </div>
                                <span class="font-semibold text-gray-900"
                                    x-text="avgRating > 0 ? avgRating : '-'"></span>
                                <span class="text-gray-400">|</span>
                                <span class="text-gray-500" x-text="totalReviews + ' отзива'"></span>
                            </div>

                            <!-- Tags -->
                            <div class="flex flex-wrap gap-2 mt-4">
                                <template x-if="data.doctor.nzok">
                                    <span
                                        class="inline-flex items-center gap-1 bg-primary-50 text-primary-700 px-3 py-1 rounded-full text-sm font-medium">
                                        <i class="fa-solid fa-check text-xs"></i>
                                        <span>НЗОК</span>
                                    </span>
                                </template>
                                <template x-if="data.doctor.children">
                                    <span
                                        class="inline-flex items-center gap-1 bg-blue-50 text-blue-700 px-3 py-1 rounded-full text-sm font-medium">
                                        <i class="fa-solid fa-child text-xs"></i>
                                        <span>Работи с деца</span>
                                    </span>
                                </template>
                                <template x-if="data.doctor.home_visits">
                                    <span
                                        class="inline-flex items-center gap-1 bg-purple-50 text-purple-700 px-3 py-1 rounded-full text-sm font-medium">
                                        <i class="fa-solid fa-house-medical text-xs"></i>
                                        <span>Домашни посещения</span>
                                    </span>
                                </template>
                                <template x-if="data.doctor.cabinet_ids && data.doctor.cabinet_ids.some(c => c.online)">
                                    <span
                                        class="inline-flex items-center gap-1 bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full text-sm font-medium">
                                        <i class="fa-solid fa-video text-xs"></i>
                                        <span>Онлайн консултации</span>
                                    </span>
                                </template>
                            </div>

                            <!-- Phone -->
                            <template x-if="data.doctor.show_phone == true">
                                <div class="flex items-center gap-2 mt-4 text-gray-600">
                                    <i class="fa-solid fa-phone text-primary-500"></i>
                                    <span x-text="data.doctor.user_info.phone"></span>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- Description -->
                    <template x-if="data.doctor.description">
                        <div class="mt-6 pt-6 border-t border-gray-100">
                            <p class="text-gray-600 leading-relaxed whitespace-pre-line"
                                x-text="data.doctor.description"></p>
                        </div>
                    </template>

                    <!-- Специализации -->
                    <template x-if="data.doctor.tags && data.doctor.tags.length">
                        <div class="mt-6 pt-6 border-t border-gray-100" x-data="{ showAllTags: false, tagsLimit: 10 }">
                            <p class="text-sm font-medium text-gray-500 mb-3">Специализации</p>
                            <div class="flex flex-wrap gap-2">
                                <template
                                    x-for="tag in (showAllTags ? data.doctor.tags : data.doctor.tags.slice(0, tagsLimit))"
                                    :key="tag.id">
                                    <span
                                        class="inline-flex items-center gap-1.5 bg-gray-100 text-gray-700 px-3 py-1 rounded-full text-sm font-medium">
                                        <i class="fa-solid fa-tag text-[10px] text-gray-400"></i>
                                        <span x-text="tag.title"></span>
                                    </span>
                                </template>
                            </div>

                            <template x-if="data.doctor.tags.length > tagsLimit">
                                <button type="button" @click="showAllTags = !showAllTags"
                                    class="mt-3 inline-flex items-center gap-1.5 text-sm font-medium text-primary-600 hover:text-primary-700 transition-colors">
                                    <span
                                        x-text="showAllTags ? 'Покажи по-малко' : 'Виж всички (' + data.doctor.tags.length + ')'"></span>
                                    <i class="fa-solid text-xs"
                                        :class="showAllTags ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
                                </button>
                            </template>
                        </div>
                    </template>
                </div>

                <!-- Education -->
                <template x-if="data.doctor.education">
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 lg:p-8">
                        <h2 class="text-xl font-bold text-gray-900 mb-4">Образование</h2>
                        <p class="text-gray-600 leading-relaxed whitespace-pre-line" x-text="data.doctor.education"></p>
                    </div>
                </template>

                <!-- Professional Experience Description -->
                <!-- <template x-if="data.doctor.biography">
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 lg:p-8">
                        <h2 class="text-xl font-bold text-gray-900 mb-4">Подробно описание на професионалния опит</h2>
                        <p class="text-gray-600 leading-relaxed whitespace-pre-line" x-text="data.doctor.biography"></p>
                    </div>
                </template> -->

                <!-- Certificates -->
                <!--
                <template x-if="data.doctor.certificates && data.doctor.certificates.length > 0">
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 lg:p-6">
                        <h2 class="text-lg font-bold text-gray-900 mb-3">Сертификати и дипломи</h2>
                        <div class="grid grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-2">
                            <template x-for="cert in data.doctor.certificates" :key="cert.id">
                                <a :href="cert.url" target="_blank" class="group relative aspect-square rounded-lg overflow-hidden bg-gray-100 hover:shadow-md transition-shadow">
                                    <img :src="cert.url" :alt="cert.filename" class="w-full h-full object-cover">
                                    <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                        <i class="fa-solid fa-magnifying-glass-plus text-white text-lg"></i>
                                    </div>
                                </a>
                            </template>
                        </div>
                    </div>
                </template>
                -->

                <!-- Video Presentation -->
                <template x-if="data.doctor.video_url || (data.doctor.video && data.doctor.video.url)">
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 lg:p-6">
                        <h2 class="text-lg font-bold text-gray-900 mb-3">Видео представяне</h2>
                        <div class="space-y-3">
                            <!-- YouTube Video -->
                            <template x-if="data.doctor.video_url && data.doctor.video_url.includes('youtube')">
                                <div class="aspect-video max-w-md rounded-xl overflow-hidden">
                                    <iframe
                                        :src="'https://www.youtube.com/embed/' + data.doctor.video_url.split('v=')[1].split('&')[0]"
                                        class="w-full h-full" frameborder="0"
                                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                        allowfullscreen></iframe>
                                </div>
                            </template>
                            <!-- Uploaded Video -->
                            <template x-if="data.doctor.video && data.doctor.video.url">
                                <div class="aspect-video max-w-md rounded-xl overflow-hidden bg-gray-900">
                                    <video :src="data.doctor.video.url" controls class="w-full h-full"></video>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

                <!-- Reviews -->
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 lg:p-8"
                    apiData="get.doctors_ratings" :data-doctor_id="data.pageUrl.id" keyName="doctor_ratings">
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-xl font-bold text-gray-900">
                            Отзиви
                            <span class="text-base font-normal text-gray-400"
                                x-text="'(' + (data.doctor_ratings.pagination?.total_results || 0) + ')'"></span>
                        </h2>
                    </div>

                    <!-- Reviews List -->
                    <div class="space-y-4">
                        <template x-for="review in data.doctor_ratings.result" :key="review.id">
                            <div class="border-b border-gray-100 pb-4 last:border-0 last:pb-0">
                                <div class="flex items-center gap-3 mb-2">
                                    <div
                                        class="w-10 h-10 rounded-full overflow-hidden bg-primary-100 flex items-center justify-center flex-shrink-0">
                                        <img :src="review.client.avatar?.url_10x10 || Helpers.image('user')"
                                            class="w-full h-full object-cover" alt="">
                                    </div>
                                    <div class="flex-1 min-w-0">
                                        <p class="font-semibold text-gray-900 truncate"
                                            x-text="review.client.names || review.client.email"></p>
                                        <div class="flex items-center gap-2">
                                            <div class="flex">
                                                <template x-for="s in 5" :key="s">
                                                    <i :class="s <= review.rating ? 'fa-solid fa-star text-amber-400' : 'fa-regular fa-star text-gray-300'"
                                                        class="text-xs"></i>
                                                </template>
                                            </div>
                                            <span class="text-xs text-gray-400"
                                                x-text="Helpers.formatDate(review.date_created)"></span>
                                        </div>
                                    </div>
                                </div>
                                <template x-if="review.text">
                                    <p class="text-gray-600 text-sm pl-[52px] whitespace-pre-line" x-text="review.text">
                                    </p>
                                </template>
                            </div>
                        </template>
                    </div>

                    <!-- Empty State -->
                    <template x-if="!data.doctor_ratings.result || data.doctor_ratings.result.length === 0">
                        <div class="text-center py-8">
                            <div
                                class="w-14 h-14 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-3">
                                <i class="fa-regular fa-comment-dots text-gray-400 text-xl"></i>
                            </div>
                            <p class="text-gray-500 text-sm">Все още няма отзиви</p>
                        </div>
                    </template>

                    <!-- Pagination -->
                    <template
                        x-if="data.doctor_ratings.pagination?.pagesArray && data.doctor_ratings.pagination.total_pages > 1">
                        <div class="flex justify-center pt-6 mt-2 border-t border-gray-100">
                            <ul class="flex items-center gap-1">
                                <template x-for="(page, index) in data.doctor_ratings.pagination.pagesArray"
                                    :key="index">
                                    <li>
                                        <button @click="alpineListeners('get.doctors_ratings', $event)"
                                            :data-page="page" :data-doctor_id="data.pageUrl.id" keyName="doctor_ratings"
                                            x-text="page"
                                            :class="page == data.doctor_ratings.pagination.current_page ? 'bg-primary-500 text-white' : 'border border-gray-200 text-gray-600 hover:bg-gray-50'"
                                            class="w-10 h-10 flex items-center justify-center rounded-lg text-sm font-medium transition-colors"></button>
                                    </li>
                                </template>
                            </ul>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Right Column - Booking Card -->
            <div class="lg:col-span-2" id="booking">
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 stickys top-24">

                    <!-- Map Placeholder -->
                    <!-- <div class="h-48 bg-gray-200 rounded-t-2xl relative overflow-hidden">
                        <div class="absolute inset-0 bg-gradient-to-b from-transparent to-gray-300/50"></div>
                        <div class="absolute inset-0 flex items-center justify-center">
                            <div class="text-center text-gray-500">
                                <i class="fa-solid fa-map-location-dot text-4xl mb-2"></i>
                                <p class="text-sm">Карта</p>
                            </div>
                        </div>
                    </div> -->

                    <template x-if="data.doctor  ">

                        <div class="p-6">
                            <h2 class="text-xl font-bold text-gray-900 mb-6">Запази час</h2>

                            <!-- Cabinet Selection -->
                            <template x-if="data.timeSlot">
                                <div class="mb-6 space-y-3">
                                    <label class="block text-sm text-gray-600 mb-2">Изберете кабинет</label>

                                    <template x-for="cabinet in data.doctor.cabinet_ids" :key="cabinet.id">
                                        <div :id="data.timeSlot.selectedCabinet.id"
                                            @click="data.timeSlot.setCabinet(cabinet); $nextTick(() => { alpineListeners('get.doctors_timeslots', $refs.getTimeslots)}) "
                                            :class="data.timeSlot.selectedCabinet.id === cabinet.id ? 'border-primary-500 bg-primary-50' : 'border-gray-200 hover:border-primary-300'"
                                            class="border rounded-xl p-4 cursor-pointer transition-colors">
                                            <div class="flex items-start gap-3">
                                                <i :class="cabinet.online ? 'fa-solid fa-video text-blue-500' : 'fa-solid fa-location-dot text-primary-500'"
                                                    class="mt-1"></i>
                                                <div class="flex-1">

                                                    <p class="text-sm text-gray-500" x-text="cabinet.address"></p>
                                                    <!-- Working days -->
                                                    <div class="flex flex-wrap gap-1 mt-2">
                                                        <template x-for="day in cabinet.schedule.dayOfWeek"
                                                            :key="day.id">
                                                            <span
                                                                :class="day.status_id === 1 ? 'bg-primary-100 text-primary-700' : 'bg-gray-100 text-gray-400'"
                                                                class="text-xs px-2 py-0.5 rounded"
                                                                x-text="day.title.substring(0, 3)"></span>
                                                        </template>
                                                    </div>
                                                    <p class="text-xs text-gray-400 mt-1"
                                                        x-text="cabinet.schedule.time_start + ' - ' + cabinet.schedule.time_end">
                                                    </p>
                                                </div>
                                                <template x-if="data.timeSlot.selectedCabinet.id === cabinet.id">
                                                    <i class="fa-solid fa-check-circle text-primary-500 text-xl"></i>
                                                </template>
                                            </div>

                                        </div>
                                    </template>
                                </div>
                            </template>

                            <!-- Service Selection -->
                            <template x-if="data.timeSlot">
                                <div class="mb-6">
                                    <label class="block text-sm text-gray-600 mb-2">Каква е причината за
                                        посещението?</label>
                                    <select @change="data.selectedServiceId = $event.target.value"
                                        class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 bg-white text-gray-700">
                                        <!-- <option value="">Избери...</option> -->
                                        <template x-for="service in data.timeSlot.selectedCabinet.services">
                                            <option :value="service.service_id"
                                                :selected="service.service_id == data.selectedServiceId"
                                                x-text="service.service.title"></option>
                                        </template>
                                    </select>
                                </div>
                            </template>

                            <!-- Взима тиме слотовете  -->

                            <form x-data="timeSlotsComponent()">
                                <input type="hidden" name="cabinet_id" x-model="selectedCabinetId">
                                <input type="hidden" name="date_from" x-model="dateFrom">
                                <p id="getTimeslots" keyName="timeSlots"></p>
                            </form>

                            <!-- Calendar -->

                            <div class="mb-6">
                                <!-- Calendar Navigation -->
                                <div class="flex items-center justify-between mb-4">
                                    <button @click="data.timeSlot.changeDays(-3)"
                                        class="p-2 transition-colors text-gray-600 hover:text-primary-600">
                                        <i class="fa-solid fa-chevron-left"></i>
                                    </button>

                                    <!-- Day Headers -->
                                    <div class="flex-1 grid grid-cols-3 gap-2 text-center">
                                        <template x-for="day in data.timeSlots">
                                            <div class="text-sm">
                                                <p class="text-gray-500"
                                                    x-text="Helpers.getDayTitleByIndex(day.dayOfWeek) "></p>
                                                <p class="font-semibold text-gray-900"
                                                    x-text="Helpers.formatDate(day.date, 'bg')"></p>
                                            </div>
                                        </template>
                                    </div>

                                    <button @click="data.timeSlot.changeDays(3)"
                                        class="p-2 transition-colors text-gray-600 hover:text-primary-600">
                                        <i class="fa-solid fa-chevron-right"></i>
                                    </button>
                                </div>

                                <!-- Time Slots Grid -->
                                <div class="grid grid-cols-3 gap-2">
                                    <template x-for="day in data.timeSlots">
                                        <div class="flex flex-wrap gap-1">
                                            <template x-if="day.time_slots.length > 0">

                                                <template x-for="time in day.time_slots">
                                                    <button
                                                        @click="time.status_id == 1 ? data.timeSlot.selectSlot(day, time) : null"
                                                        :class="time.status_id != 1
                                                            ? 'bg-gray-100 text-gray-400 border-gray-200 cursor-not-allowed line-through'
                                                            : (data.timeSlot.selectedТimeStart === time.time_start && data.timeSlot.selectedDate === day.date
                                                                ? 'bg-primary-500 text-white border-primary-500'
                                                                : 'bg-white text-primary-600 border-primary-200 hover:border-primary-500 hover:bg-primary-50')"
                                                        :disabled="time.status_id != 1"
                                                        class="w-fit h-fit py-2 px-4 border rounded-lg text-base font-medium transition-colors inline-flex items-center gap-1.5">
                                                        <span x-text="time.time_start"></span>
                                                        <template x-if="time.online">
                                                            <i class="fa-solid fa-video text-xs"
                                                                :class="time.status_id != 1 ? 'text-gray-400' : (data.timeSlot.selectedТimeStart === time.time_start && data.timeSlot.selectedDate === day.date ? 'text-white' : 'text-blue-500')"
                                                                title="Възможна е онлайн консултация"></i>
                                                        </template>
                                                    </button>
                                                </template>

                                            </template>

                                            <template x-if="day.time_slots.length === 0">
                                                <div
                                                    class="h-full flex items-center justify-center bg-gray-50 rounded-lg">
                                                    <p class="text-gray-600 text-base text-center px-2">Няма налични
                                                        часове</p>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>

                                <!-- Legend -->
                                <template
                                    x-if="Object.values(data.timeSlots || {}).some(d => (d.time_slots || []).some(t => t.online))">
                                    <p class="mt-3 text-xs text-gray-500 flex items-center gap-1.5">
                                        <i class="fa-solid fa-video text-blue-500"></i>
                                        Провежда онлайн часове
                                    </p>
                                </template>
                            </div>

                            <!-- Book Button -->
                            <template x-if="!data.user.logged_in ">
                                <button type="button" @click="data.timeSlot.savePending(); callModal($el)"
                                    data-modal="login"
                                    :class="(!data.timeSlot.selectedТimeStart || !data.timeSlot.selectedDate) ? 'bg-gray-300 cursor-not-allowed' : ''"
                                    class="w-full bg-accent-500 hover:bg-accent-600 py-3 text-white font-semibold rounded-xl transition-colors mb-6">
                                    <i class="fa-solid fa-calendar-check mr-2"></i>
                                    Запази час
                                </button>
                            </template>

                            <template x-if="data.user.logged_in ">
                                <button type="button" @click="data.showBookingModal = true"
                                    :class="(!data.timeSlot.selectedТimeStart || !data.timeSlot.selectedDate) ? 'bg-gray-300 cursor-not-allowed' : ''"
                                    class="w-full bg-accent-500 hover:bg-accent-600 py-3 text-white font-semibold rounded-xl transition-colors mb-6">
                                    <i class="fa-solid fa-calendar-check mr-2"></i>
                                    Запази час
                                </button>
                            </template>

                            <!-- Help Section -->
                            <div class="border-t border-gray-100 pt-6">
                                <p class="font-semibold text-gray-900 mb-2">Имате нужда от помощ?</p>
                                <p class="text-sm text-gray-600">
                                    Разгледайте страницата ни с <a href="#"
                                        class="text-primary-600 hover:underline">Често задавани въпроси</a> или ни
                                    пишете на <a href="mailto:hello@CareNet.bg"
                                        class="text-primary-600 hover:underline">hello@CareNet.bg</a>
                                </p>
                            </div>
                        </div>

                    </template>
                </div>
            </div>

        </div>
    </div>

</main>

<!-- Booking Confirmation Modal -->
<div x-show="data.showBookingModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4"
    x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-200"
    x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0">

    <!-- Backdrop -->
    <div class="absolute inset-0 bg-black/50" @click="data.showBookingModal = false"></div>

    <!-- Modal Content -->
    <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto"
        x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 scale-95"
        x-transition:enter-end="opacity-100 scale-100" x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-95">
        <form>

            <input type="hidden" :value="data.timeSlot.selectedCabinet.id" name="cabinet_id">
            <input type="hidden" :value="data.selectedServiceId" name="service_id">

<!-- Логика за слотовете  -->
<script>
    function timeSlotsComponent() {
        return data.timeSlot = {
            dateFrom: '',
            selectedCabinet: {},
            selectedТimeStart: '',
            selectedDate: '',
            selectedTimeOnline: false,

            shouldGet: false,
            _scheduled: false,

            get selectedCabinetId() {
                return this.selectedCabinet?.id ?? '';
            },

            // Съкратен вид на линка за видео консултация
            shortLink(url, max = 30) {
                if (!url) return '';
                let short = String(url).trim();
                try {
                    const u = new URL(/^https?:\/\//i.test(short) ? short : 'https://' + short);
                    short = u.hostname.replace(/^www\./, '') + (u.pathname + u.search).replace(/\/$/, '');
                } catch (e) { }
                return short.length > max ? short.slice(0, max) + '…' : short;
            },

            // Избор на конкретен слот — пази и дали часът позволява онлайн консултация
            selectSlot(day, time) {
                this.selectedТimeStart = time.time_start;
                this.selectedDate = day.date;
                this.selectedTimeOnline = !!time.online;
                data.bookingVisitType = 'in-person';
            },

            init() {
                this.shouldGet = false;

                data.showBookingModal = false;
                data.bookingVisitType = 'in-person';
                this.selectedTimeOnline = false;

                this.dateFrom = this.toYmd(new Date());

                // Задаваме първия кабинет по подразбиране
                const firstCabinet = data?.doctor?.cabinet_ids?.[0];
                if (firstCabinet) {
                    this.selectedCabinet = firstCabinet;
                    data.selectedServiceId = firstCabinet.services?.[0]?.service_id;
                }

                // Възстановяваме избран час след вход / регистрация
                this.restorePending();

                this.$watch('dateFrom', (value, oldValue) => {
                    if (!value || value === oldValue || !this.shouldGet) return;
                    this.scheduleGet();
                });

                this.$watch('selectedCabinet.id', (value, oldValue) => {
                    if (value === oldValue || !this.shouldGet) return;
                    this.scheduleGet();
                });

                this.shouldGet = true;

                // initial get СЛЕД като DOM/bindings са приложени
                this.$nextTick(() => this.get());
            },

            // Пази избрания час, за да не се губи при отиване към регистрация
            savePending() {
                if (!this.selectedТimeStart || !this.selectedDate) return;
                try {
                    sessionStorage.setItem('pendingBooking', JSON.stringify({
                        doctor_id: data.doctor?.id,
                        cabinet_id: this.selectedCabinet?.id,
                        service_id: data.selectedServiceId,
                        date: this.selectedDate,
                        time_start: this.selectedТimeStart,
                        online: this.selectedTimeOnline,
                        saved_at: Date.now()
                    }));
                } catch (e) { }
            },

            restorePending() {
                let pending = null;
                try {
                    pending = JSON.parse(sessionStorage.getItem('pendingBooking') || 'null');
                } catch (e) { }
                if (!pending) return;

                const expired = Date.now() - (pending.saved_at || 0) > 60 * 60 * 1000;
                const cabinet = data.doctor?.cabinet_ids?.find(c => c.id == pending.cabinet_id);

                if (expired || pending.doctor_id != data.doctor?.id || !cabinet || pending.date < this.toYmd(new Date())) {
                    if (expired || pending.date < this.toYmd(new Date())) sessionStorage.removeItem('pendingBooking');
                    return;
                }

                this.selectedCabinet = cabinet;
                data.selectedServiceId = pending.service_id ?? cabinet.services?.[0]?.service_id;
                this.dateFrom = pending.date;
                this.selectedDate = pending.date;
                this.selectedТimeStart = pending.time_start;
                this.selectedTimeOnline = !!pending.online;

                // Логнат — директно към потвърждението
                if (data.user?.logged_in) {
                    sessionStorage.removeItem('pendingBooking');
                    data.showBookingModal = true;
                }
            },

            scheduleGet() {
                if (this._scheduled) return;
                this._scheduled = true;

                this.$nextTick(() => {
                    this._scheduled = false;
                    this.get();
                });
            },

            get() {
                const el = document.getElementById('getTimeslots');
                if (!el) return;

                data.timeSlotFrom = this.dateFrom;

                alpineListeners('get.doctors_timeslots', el);
            },

            changeDays(deltaDays) {
                const d = this.parseYmd(this.dateFrom);
                d.setDate(d.getDate() + Number(deltaDays));
                this.dateFrom = this.toYmd(d);
            },

            setDate(newDate) {
                const normalized = this.normalizeDate(newDate);
                if (!normalized) return;
                this.dateFrom = normalized;
            },

            setCabinet(cabinet) {
                ;
                this.selectedCabinet = cabinet ?? {};
                data.selectedServiceId = cabinet.services?.[0]?.service_id;
            },

            normalizeDate(v) {
                if (!v) return '';
                if (v instanceof Date) return this.toYmd(v);
                if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;

                const d = new Date(v);
                if (Number.isNaN(d.getTime())) return '';
                return this.toYmd(d);
            },

            parseYmd(ymd) {
                const [y, m, d] = String(ymd).split('-').map(Number);
                return new Date(y, m - 1, d);
            },

            toYmd(dateObj) {
                const y = dateObj.getFullYear();
                const m = String(dateObj.getMonth() + 1).padStart(2, '0');
                const d = String(dateObj.getDate()).padStart(2, '0');
                return `${y}-${m}-${d}`;
            }
        };
    }
</script>
