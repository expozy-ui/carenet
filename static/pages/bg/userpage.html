<!-- Redirect if not logged in -->

                                        <input id="dropzone-avatar2" @change="loading = true; await alpineListeners('post.doctors', $event); loading = false;" keyName="my_doctor" name="avatar" type="file" class="hidden" />

                                                        </div>
                                                    </template>

                                                    <!-- Avatar Image (hidden during loading) -->
                                                    <template x-if="!loading && data.my_doctor.avatar.url_10x10 != ''">
                                                        <div class="w-full h-full group">
                                                            <img :src="data.my_doctor.avatar.url_10x10" class="w-full h-full object-cover transition-all duration-300 group-hover:brightness-75" alt="Avatar">
                                                            <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                                                                <i class="fa-light fa-camera text-white text-xl"></i>
                                                            </div>
                                                        </div>

                                <div class="flex items-start gap-4">
                                    <div class="w-12 h-12 bg-amber-100 rounded-full flex items-center justify-center flex-shrink-0">

                                    <div>

                                        <span :class="data.my_doctors_dashboards.app_percent_month >= 0 ? 'text-primary-600 bg-primary-50' : 'text-red-600 bg-red-50'" class="text-xs px-2 py-1 rounded-full">

                            if (apt.time_end) {

                                const totalMin = h * 60 + m + interval;
                                const eh = String(Math.floor(totalMin / 60)).padStart(2, '0');
                                const em = String(totalMin % 60).padStart(2, '0');
                                endTime = eh + em + '00';

                            const dates = datePart + 'T' + startTime + '/' + datePart + 'T' + endTime;
                            const title = apt.service?.title || (apt.cabinet?.services?.[0]?.service?.title) || 'Медицински час';

                                text: title,
                                dates: dates,

                            });

                            this.$nextTick(() => { this.fetchSlots(); this.fetchBlockSeries(); });

                        fetchSlots() {
                            const el = document.getElementById('blockTimeslots');
                            if (!el) return;
                            alpineListeners('get.doctors_timeslots', el);
                        },

                        fetchBlockSeries() {

                            if (!el) return;
                            alpineListeners('get.my_doctors_timeslot_block_series', el);

                        get currentCabinet() {

                                    <div class="flex h-full">
                                        <!-- Chat List -->
                                        <div class="w-full md:w-80 border-r border-gray-100 flex flex-col" :class="data.messages.currentRoom !== null ? 'hidden md:flex' : ''">

                                                    <div :data-room_id="group.id" @click="alpineListeners('post.messages_log', $el); group.new_messages = 0;  data.messages.currentRoom = group;  $nextTick(() => {document.getElementById('message_box').scrollTop = document.getElementById('message_box').scrollHeight});" :class="group.object_id == data.messages.currentRoom.object_id ? 'bg-primary-50 border-l-4 border-primary-500' : 'hover:bg-gray-50'" class="flex items-center gap-3 p-4 cursor-pointer transition-colors border-b border-gray-50">
                                                        <div class="relative">

                                                            <template x-if="group.avatar != '' ">
                                                                <img :src="group.avatar" class="w-12 h-12 rounded-full object-cover">
                                                            </template>

                                                            <template x-if="group.avatar == '' ">

                                                                    <i class="fa-solid fa-user text-gray-400"></i>
                                                                </div>
                                                            </template>

                                                            <template x-if="group.new_messages > 0">

                                                            </div>
                                                            <p class="text-sm text-gray-500 truncate" x-text="group.messages[0]?.text || ''"></p>
                                                        </div>
                                                    </div>
                                                </template>

                                        </div>

                                                                </template>

                                                                <template x-if="user.avatar.url_10x10 == '' ">

                                                                        <i class="fa-solid fa-user text-gray-400"></i>

                                                                </template>
                                                            </div>
                                                        </template>
                                                    </div>

                                                    <!-- Messages -->

                                                            <div :class="message.user_id == data.user.id ? 'flex justify-end' : 'flex justify-start'">

                                                                    <!-- Text message -->
                                                                    <template x-if="!message.is_file">
                                                                        <p x-text="message.text"></p>
                                                                    </template>
                                                                    <!-- File message -->
                                                                    <template x-if="message.is_file">
                                                                        <div @click="alpineListeners(`get.${message.file.path}`, $event)" class="flex items-center gap-2 cursor-pointer group">
                                                                            <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0" :class="message.user_id == data.user.id ? 'bg-white/20' : 'bg-primary-50'">
                                                                                <i class="fa-solid text-sm" :class="[
                                                                                    message.file.filename.match(/\.(jpg|jpeg|png|gif|webp)$/i) ? 'fa-file-image' :
                                                                                    message.file.filename.match(/\.pdf$/i) ? 'fa-file-pdf' :
                                                                                    message.file.filename.match(/\.(doc|docx)$/i) ? 'fa-file-word' :
                                                                                    message.file.filename.match(/\.(xls|xlsx)$/i) ? 'fa-file-excel' :

                                                                                    message.user_id == data.user.id ? 'text-white' : 'text-accent-500'

                                                                        </div>
                                                                    </template>

                                                                    <p :class="message.user_id == data.user.id ? 'text-primary-100' : 'text-gray-400'" class="text-xs mt-1" x-text="Helpers.formatDate(message.date_created)"></p>
                                                                </div>
                                                            </div>
                                                        </template>
                                                    </div>

                                                    <!-- Message Input -->
                                                    <div class="p-4 border-t border-gray-100 bg-white" x-data="{ pendingFiles: [], msgText: '' }">

                                                                        <span x-text="file.name" class="max-w-[150px] truncate"></span>
                                                                    </span>
                                                                </template>
                                                                <button type="button" @click="pendingFiles = []; $refs.fileInput.value = ''" class="p-1 text-red-400 hover:text-red-600 hover:bg-red-50 rounded transition-colors">
                                                                    <i class="fa-solid fa-xmark text-sm"></i>
                                                                </button>
                                                            </div>
                                                        </template>
                                                        <form autocomplete="off" @submit.prevent="if(msgText.trim() || pendingFiles.length > 0) alpineListeners('post.messages', $refs.sendBtn)">
                                                            <input type="hidden" name="room_id" :value="data.messages.currentRoom.id">

                                                            <div class="flex items-center gap-3">
                                                                <div>
                                                                    <input @change="pendingFiles = Array.from($el.files)" x-ref="fileInput" name="files" type="file" class="hidden" id="files" multiple>

                                                                        <i class="fa-solid fa-link text-2xl transition-colors" :class="pendingFiles.length > 0 ? 'text-accent-500' : 'text-primary-600'"></i>
                                                                    </label>
                                                                </div>

                                                                <input name="text" x-model="msgText" x-ref="textfield" type="text" placeholder="Напишете съобщение..." class="flex-1 px-4 py-3 bg-gray-100 rounded-xl border-0 focus:ring-2 focus:ring-primary-500">
                                                                <button type="button" x-ref="sendBtn" type="button" @click="alpineListeners('post.messages', $event)" keyName="dummy" :disabled="!msgText.trim() && pendingFiles.length === 0" @success="data.messages.currentRoom.messages.push($event.detail.response.obj); msgText = ''; $refs.textfield.value = ''; pendingFiles = []; $refs.fileInput.value = ''; $nextTick(() => { $refs.messages_box.scrollTop = $refs.messages_box.scrollHeight })" class="p-3 bg-accent-500 hover:bg-accent-600 text-white rounded-xl transition-colors disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-accent-500">
                                                                    <i class="fa-solid fa-paper-plane"></i>
                                                                </button>
                                                            </div>
                                                        </form>
                                                    </div>
                                                </div>
                                            </template>

                                            <!-- No Chat Selected -->
                                            <template x-if="data.messages.currentRoom === null">
                                                <div class="flex-1 flex items-center justify-center">
                                                    <div class="text-center">
                                                        <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                                            <i class="fa-solid fa-comments text-gray-400 text-3xl"></i>
                                                        </div>
                                                        <p class="text-gray-500">Изберете чат, за да започнете разговор</p>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                    <p class="text-center text-gray-400 text-xs py-2"><i class="fa-solid fa-clock-rotate-left mr-1"></i>Всички съобщения се изтриват автоматично след 90 дни.</p>

                                </div>
                            </template>

                            <template x-if="Object.values(data.messages_rooms).length < 1">
                                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-12 text-center">
                                    <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                        <i class="fa-solid fa-comments text-gray-400 text-3xl"></i>
                                    </div>
                                    <p class="text-gray-500">Нямате активни съобщения</p>
                                </div>
                            </template>
                        </div>

                    </template>

                </div>
            </div>
        </div>
    </div>
</template>

                            return days[date.getDay()];

                            const date = new Date(dateStr);
                            return date.getDate();

                        formatDateMonth(dateStr) {
                            const months = ['Яну', 'Фев', 'Мар', 'Апр', 'Май', 'Юни', 'Юли', 'Авг', 'Сеп', 'Окт', 'Ное', 'Дек'];

                            const startTime = (apt.time_start || '00:00').replace(':', '') + '00';
                            let endTime;
                            if (apt.time_end) {
                                endTime = apt.time_end.replace(':', '') + '00';
                            } else {
                                const interval = parseInt(apt.interval) || 30;
                                const [h, m] = (apt.time_start || '00:00').split(':').map(Number);
                                const totalMin = h * 60 + m + interval;
                                const eh = String(Math.floor(totalMin / 60)).padStart(2, '0');
                                const em = String(totalMin % 60).padStart(2, '0');
                                endTime = eh + em + '00';
                            }
                            const dates = datePart + 'T' + startTime + '/' + datePart + 'T' + endTime;
                            const title = apt.service?.title || (apt.cabinet?.services?.[0]?.service?.title) || 'Медицински час';
                            let location = '';
                            if (apt.cabinet?.online && apt.cabinet?.online_url) {
                                location = apt.cabinet.online_url;
                            } else if (apt.cabinet?.address) {
                                location = apt.cabinet.address;
                            }
                            const nl = String.fromCharCode(10);
                            let details = 'Специалист: ' + (apt.doctor?.user_info?.names || '');
                            if (apt.doctor?.speciality?.title) details += nl + 'Специалност: ' + apt.doctor.speciality.title;
                            if (apt.service?.title) details += nl + 'Услуга: ' + apt.service.title;
                            if (apt.price) details += nl + 'Цена: ' + apt.price + ' €.';
                            if (apt.cabinet?.online && apt.cabinet?.online_url) details += nl + 'Онлайн: ' + apt.cabinet.online_url;
                            const params = new URLSearchParams({
                                action: 'TEMPLATE',
                                text: title,
                                dates: dates,
                                details: details
                            });
                            if (location) params.set('location', location);
                            return 'https://calendar.google.com/calendar/render?' + params.toString();

<script>
    function _generateTimeSlots(schedule) {
        if (!schedule || !schedule.time_start || !schedule.time_end || !schedule.interval) return [];
        var slots = [];
        var sp = schedule.time_start.split(':');
        var ep = schedule.time_end.split(':');
        var startMin = parseInt(sp[0]) * 60 + parseInt(sp[1]);
        var endMin = parseInt(ep[0]) * 60 + parseInt(ep[1]);
        var interval = parseInt(schedule.interval);
        for (var m = startMin; m < endMin; m += interval) {
            var h = Math.floor(m / 60);
            var min = m % 60;
            slots.push((h < 10 ? '0' + h : '' + h) + ':' + (min < 10 ? '0' + min : '' + min));
        }
        return slots;
    }
    window._generateTimeSlots = _generateTimeSlots;
</script>

<script>
    function loadingEffect() {
        return {
            width: 0,
            init() {
                this.startLoading();
            },
            startLoading() {
                let increment = 1;
                let speed = 20;

                const loadingInterval = setInterval(() => {
                    if (this.width < 95) {
                        this.width += increment;


                        if (this.width < 50) {
                            speed = 40;
                            increment += 1.2;
                        }
                        if (this.width < 60) {
                            increment += 1.2;
                        } else if (this.width < 70) {
                            speed = 400;
                            increment += 1.2;
                        }
                        else if (this.width < 80) {
                            speed = 200;
                            increment += 1.2;
                        } else if (this.width < 90) {
                            speed = 500;
                            increment += 1.2;
                        } else if (this.width < 95) {
                            speed = 600;
                            increment += 1.2;
                        }



                        clearInterval(loadingInterval);
                        setTimeout(() => this.startLoading(), speed);
                    } else {
                        clearInterval(loadingInterval);
                    }
                }, speed);
            }
        }
    }
</script>

<script>
    function doctorServicesComponent() {
        return {

            data: window.data || {},

            init() {

                if (!Array.isArray(this.data.my_doctor.unique_services)) this.data.my_doctor.unique_services = [];

                this.dedupeServicesToGlobal();

                // следи промените и преизчислява
                this.$watch('data.my_doctor.services', () => {
                    this.dedupeServicesToGlobal();
                });
            },

            dedupeServicesToGlobal() {
                const map = new Map();

                // ВАЖНО: this.data..., за да е реактивно в Alpine
                for (const item of this.data.my_doctor.services) {
                    const key = Number(item.service_id); // нормализация (по избор)
                    if (!map.has(key)) {
                        map.set(key, item); // пази първия
                    }
                }

                // записваме в глобалния data обект
                this.data.my_doctor.unique_services = Array.from(map.values());
            }
        }
    }

    function get_my_doctor() {
        alpineListeners('get.my_doctor', document.getElementById('doctor'));
    }
</script>
